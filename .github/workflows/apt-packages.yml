# Oracle Linux 9 package-validation extension contributed by Johan Louwers.
# It checks the full DNF dependency set, including Oracle's oVirt RPM source.
name: Apt Packages

# Path-filtered like image-scripts.yml: this resolves setup.sh's runtime package
# list against each supported suite's real indices, so a renamed, dropped, or
# ambiguously virtual package fails here rather than on a user's machine.
on:
  push:
    branches:
      - main
      - dev
    paths:
      - scripts/setup.sh
      - scripts/lint-apt-packages.sh
      - scripts/lint-dnf-packages.sh
      - .github/workflows/apt-packages.yml
  pull_request:
    branches:
      - main
      - dev
    paths:
      - scripts/setup.sh
      - scripts/lint-apt-packages.sh
      - scripts/lint-dnf-packages.sh
      - .github/workflows/apt-packages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apt_packages:
    name: Resolve apt list (${{ matrix.image }})
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - ubuntu:26.04
          - debian:13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Resolve runtime package list
        run: ./scripts/lint-apt-packages.sh ${{ matrix.image }}

  ol9_packages:
    name: Resolve supported DNF base list (oraclelinux:9)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Resolve runtime package list
        run: ./scripts/lint-dnf-packages.sh oraclelinux:9
